name: progweb

services:
  progweb-mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  progweb-api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      progweb-mysql:
        condition: service_healthy
    environment:
      DB_HOST: progweb-mysql
      DB_PORT: 3306
      DB_NAME: progweb
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      INTEGRADOR_TOKEN: ${INTEGRADOR_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@progweb.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  progweb-web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      progweb-api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql_data:
