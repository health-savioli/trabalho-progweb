spring.application.name=api

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:progweb}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

server.error.include-message=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-minutos=120

app.seed.admin.email=${ADMIN_EMAIL:admin@progweb.com}
app.seed.admin.senha=${ADMIN_PASSWORD:admin123}

app.integrador.url=https://integrador-urs-api-production.up.railway.app/api
app.integrador.token=${INTEGRADOR_TOKEN:}
app.integrador.cabine-id=cabine-01
app.integrador.equipamento=ilhealth_n9
app.integrador.duracao-segundos=900
